<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="在浏览器里创造粒子星河、流动波浪与光环，实时调节并导出 PNG。">
<title>光场 v2 · Effects Lab</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11141c;--line:#262b39;--text:#eef0f7;--muted:#8e96aa;--accent:#b9a4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 5vw}.brand{font-size:21px;font-weight:700;letter-spacing:1px}.brand i{font-style:normal;color:var(--accent);margin-right:12px}.brand small{font-weight:400;font-size:11px;letter-spacing:3px;color:var(--muted);margin-left:16px}.badge{font-size:11px;letter-spacing:2px;color:#a8b6ad}.badge:before{content:'●';color:#a7e7bb;margin-right:8px}main{max-width:1500px;margin:auto;padding:44px 5vw}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:3px}h1{font-size:clamp(27px,3vw,40px);letter-spacing:-1px;margin:10px 0}p{color:var(--muted);margin:0}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;margin-top:32px}.stage{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#080a12;position:relative;min-height:490px}canvas{display:block;width:100%;height:490px;touch-action:none}.stage-top{position:absolute;top:20px;left:22px;right:22px;display:flex;justify-content:space-between;pointer-events:none;color:#abb2c7;font-size:11px;letter-spacing:2px}.stage-note{position:absolute;bottom:19px;left:22px;font-size:11px;color:#808aab;pointer-events:none}.controls{padding:23px;background:var(--panel);border:1px solid var(--line);border-radius:18px}h2{font-size:14px;margin:0 0 24px}.field{margin-bottom:23px}.field label{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#c3c8d7;font-size:12px}output{font-variant-numeric:tabular-nums;color:var(--accent)}select{width:100%;padding:11px;background:#1b1f2a;border:1px solid #303646;border-radius:8px}input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}input[type=color]{width:40px;height:29px;padding:2px;border:1px solid #40475b;border-radius:6px;background:transparent;cursor:pointer}.swatches{display:flex;gap:10px;align-items:center}.swatch{width:25px;height:25px;border:3px solid var(--panel);outline:1px solid #41485c;border-radius:50%;background:var(--swatch)}.buttons{display:flex;gap:9px}.buttons button,.export{border:1px solid #343a4d;background:#202534;padding:10px 15px;border-radius:8px;flex:1}.export{width:100%;background:var(--accent);color:#171226;font-weight:650;border:0;margin-top:13px}.export:hover{background:#cabaff}button:hover{filter:brightness(1.12)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}.card{text-align:left;border:1px solid var(--line);border-radius:12px;padding:17px;background:#10131b;display:flex;align-items:center;gap:13px}.card[aria-pressed=true]{border-color:#b9a4ff;background:#1d1a2e}.symbol{font-size:26px;color:var(--accent);width:36px}.card strong{font-size:13px;display:block}.card small{color:var(--muted);font-size:11px}footer{display:flex;justify-content:space-between;margin-top:29px;color:#6e778d;font-size:11px;letter-spacing:1px}#status{min-height:20px;color:var(--accent);font-size:11px;margin-top:12px}@media(max-width:850px){.workspace{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.controls h2,.controls #status{grid-column:1/-1}.stage,canvas{height:410px;min-height:410px}.cards{gap:8px}.card{padding:12px;gap:5px}.symbol{font-size:20px}header{height:72px}.brand small{display:none}}@media(max-width:480px){main{padding-top:28px}.cards{grid-template-columns:1fr}.controls{display:block}footer{display:block}.badge{font-size:9px}}
</style>
<style>.preset-tools{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--line)}.preset-tools label{display:block;font-size:12px;color:#c3c8d7;margin-bottom:9px}.preset-tools .buttons{margin-top:10px}.preset-tools button{font-size:12px;padding:9px 7px}@media(min-width:481px) and (max-width:850px){.preset-tools{grid-column:1/-1}}</style>
</head>
<body>
<header><div class="brand"><i>✳</i>光场 <small>EFFECTS LAB</small></div><div class="badge">在浏览器中实时生成</div></header>
<main><div class="eyebrow">PLAY WITH LIGHT / VERSION 2.0</div><h1>把灵感，变成光。</h1><p>从一套预设出发，探索随机灵感，再保存你喜欢的光场。</p>
<div class="workspace"><section class="stage" aria-label="特效实时预览"><canvas id="canvas" aria-label="可交互的粒子特效画布">你的浏览器需要支持 Canvas 才能显示特效。</canvas><div class="stage-top"><span id="sceneTitle">01 / 粒子星河</span><span>LIVE CANVAS</span></div><div class="stage-note">移动指针吸引光点 · 点击画布释放涟漪</div></section>
<aside class="controls"><h2>调制你的光场 <span style="color:#677089;float:right">↗</span></h2>
<div class="preset-tools"><label for="preset">灵感预设</label><select id="preset"><option value="">选择一套预设…</option value="dream">紫色星梦</option><option value="ocean">极光海洋</option><option value="sunset">日落轨道</option></select><div class="buttons"><button id="randomize">✧ 随机灵感</button></div><div class="buttons"><button id="savePreset">保存参数</button><button id="loadPreset">恢复参数</button></div></div>
<div class="field"><label for="mode">特效模式</label><select id="mode"><option value="galaxy">粒子星河</option><option value="wave">流光波浪</option><option value="orbit">轨道光环</option></select></div>
<div class="field"><label for="color">主题颜色 <input id="color" type="color" value="#b9a4ff"></label><div class="swatches"><button class="swatch" style="--swatch:#b9a4ff" data-color="#b9a4ff" aria-label="淡紫色"></button><button class="swatch" style="--swatch:#74e7df" data-color="#74e7df" aria-label="青绿色"></button><button class="swatch" style="--swatch:#ffb789" data-color="#ffb789" aria-label="暖橙色"></button><button class="swatch" style="--swatch:#f49acb" data-color="#f49acb" aria-label="粉红色"></button></div></div>
<div class="field"><label for="count">粒子数量 <output id="countValue">360</output></label><input id="count" type="range" min="80" max="700" step="20" value="360"></div>
<div class="field"><label for="speed">流动速度 <output id="speedValue">1.0×</output></label><input id="speed" type="range" min="0.1" max="2.5" step="0.1" value="1"></div>
<div class="field"><label for="glow">辉光强度 <output id="glowValue">65%</output></label><input id="glow" type="range" min="0" max="100" value="65"></div>
<div class="buttons"><button id="pause" aria-pressed="false">暂停</button><button id="reset">重置</button></div><button class="export" id="export">↓ 导出 PNG 图片</button><div id="status" role="status" aria-live="polite">所有效果在本地生成</div></aside></div>
<div class="cards"><button class="card" data-mode="galaxy" aria-pressed="true"><span class="symbol">✧</span><span><strong>01 · 粒子星河</strong><small>让星光在指尖聚集</small></span></button><button class="card" data-mode="wave" aria-pressed="false"><span class="symbol">≈</span><span><strong>02 · 流光波浪</strong><small>有节奏地起伏、呼吸</small></span></button><button class="card" data-mode="orbit" aria-pressed="false"><span class="symbol">◎</span><span><strong>03 · 轨道光环</strong><small>探索光的引力与秩序</small></span></button></div>
<footer><span>光场 / EFFECTS LAB</span><span>零依赖 · 无需登录 · 自由探索</span></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let w=1,h=1,t=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,points=[],ripples=[];
const pointer={x:0,y:0,active:false},names={galaxy:'01 / 粒子星河',wave:'02 / 流光波浪',orbit:'03 / 轨道光环'};
function seed(){points=Array.from({length:+$('count').value},()=>({x:Math.random(),y:Math.random(),phase:Math.random()*Math.PI*2,r:.5+Math.random()*1.6}));}
function resize(){const rect=canvas.getBoundingClientRect();w=rect.width;h=rect.height;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function draw(){ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle='#080a12';ctx.fillRect(0,0,w,h);const color=$('color').value,mode=$('mode').value,glow=+$('glow').value/100;const bg=ctx.createRadialGradient(w*.5,h*.5,0,w*.5,h*.5,w*.55);bg.addColorStop(0,color+'20');bg.addColorStop(1,'#080a1200');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.fillStyle=color;ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=glow*17;
points.forEach((p,i)=>{let x,y;if(mode==='galaxy'){x=((p.x*w+Math.sin(t*.3+p.phase)*30)%w+w)%w;y=((p.y*h+t*(4+p.r*3))%h+h)%h;}else if(mode==='wave'){const cols=Math.ceil(points.length/8),row=Math.floor(i/cols);x=(i%cols)/(cols-1)*w;y=h*.5+(row-3.5)*23+Math.sin(x/w*7+t+row*.35)*50+Math.cos(x/w*3-t*.5)*30;}else{const ring=i%6,a=p.phase+t*(.13+ring*.035),radius=Math.min(w,h)*(.15+ring*.045);x=w*.5+Math.cos(a)*radius*1.5;y=h*.5+Math.sin(a)*radius*.65+Math.sin(t*.6+ring)*10;}if(pointer.active){const dx=pointer.x-x,dy=pointer.y-y,d=Math.hypot(dx,dy);if(d<140){x+=dx*.18*(1-d/140);y+=dy*.18*(1-d/140);}}ctx.globalAlpha=.35+.65*(.5+.5*Math.sin(p.phase+t));ctx.beginPath();ctx.arc(x,y,p.r*(mode==='orbit'?1.15:1),0,Math.PI*2);ctx.fill();});
ctx.lineWidth=1.3;ripples.forEach(r=>{const age=t-r.start;ctx.globalAlpha=Math.max(0,1-age/2);ctx.beginPath();ctx.arc(r.x,r.y,age*95+2,0,Math.PI*2);ctx.stroke();});ctx.globalAlpha=1;ctx.shadowBlur=0;}
function frame(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!paused&&!document.hidden){t+=dt*+$('speed').value;ripples=ripples.filter(r=>t-r.start<2);draw();}requestAnimationFrame(frame);}
function syncPause(){$('pause').textContent=paused?'继续播放':'暂停';$('pause').setAttribute('aria-pressed',String(paused));}
function setMode(mode){$('mode').value=mode;$('sceneTitle').textContent=names[mode];document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));draw();}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
$('mode').addEventListener('change',()=>setMode($('mode').value));
document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{$('color').value=b.dataset.color;draw();}));
['color','count','speed','glow'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='count'){seed();$('countValue').value=$('count').value;}if(id==='speed')$('speedValue').value=(+$('speed').value).toFixed(1)+'×';if(id==='glow')$('glowValue').value=$('glow').value+'%';draw();}));
$('pause').addEventListener('click',()=>{paused=!paused;syncPause();});
$('reset').addEventListener('click',()=>{$('color').value='#b9a4ff';$('count').value=360;$('speed').value=1;$('glow').value=65;$('countValue').value='360';$('speedValue').value='1.0×';$('glowValue').value='65%';t=0;ripples=[];paused=matchMedia('(prefers-reduced-motion: reduce)').matches;syncPause();seed();setMode('galaxy');$('status').textContent='已恢复默认参数';});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;pointer.active=true;if(paused)draw();});canvas.addEventListener('pointerleave',()=>{pointer.active=false;if(paused)draw();});
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();ripples.push({x:e.clientX-r.left,y:e.clientY-r.top,start:t});if(ripples.length>20)ripples.shift();if(paused){draw();$('status').textContent='继续播放可查看涟漪动画';}});
$('export').addEventListener('click',()=>{draw();canvas.toBlob(blob=>{if(!blob){$('status').textContent='导出失败，请重试';return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='effects-lab-'+$('mode').value+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);$('status').textContent='PNG 图片已生成';},'image/png');});
const storageKey='effects-lab.settings.v2';
const presets={dream:{mode:'galaxy',color:'#b9a4ff',count:480,speed:.6,glow:85},ocean:{mode:'wave',color:'#74e7df',count:560,speed:1.2,glow:70},sunset:{mode:'orbit',color:'#ffb789',count:360,speed:.8,glow:90}};
function settings(){return {mode:$('mode').value,color:$('color').value,count:+$('count').value,speed:+$('speed').value,glow:+$('glow').value};}
function validSettings(s){return s&&typeof s==='object'&&Object.hasOwn(names,s.mode)&&/^#[0-9a-f]{6}$/i.test(s.color)&&Number.isInteger(s.count)&&s.count>=80&&s.count<=700&&s.count%20===0&&Number.isFinite(s.speed)&&s.speed>=.1&&s.speed<=2.5&&Math.abs(s.speed*10-Math.round(s.speed*10))<1e-8&&Number.isInteger(s.glow)&&s.glow>=0&&s.glow<=100;}
function applySettings(s){if(!validSettings(s))return false;for(const id of ['color','count','speed','glow'])$(id).value=s[id];$('countValue').value=String(s.count);$('speedValue').value=s.speed.toFixed(1)+'×';$('glowValue').value=s.glow+'%';pointer.active=false;ripples=[];seed();setMode(s.mode);return true;}
$('preset').addEventListener('change',()=>{const choice=$('preset').value;if(Object.hasOwn(presets,choice)){applySettings(presets[choice]);$('status').textContent='预设已应用，可以继续微调';}});
$('randomize').addEventListener('click',()=>{const modes=Object.keys(names),colors=['#b9a4ff','#74e7df','#ffb789','#f49acb','#89baff'];applySettings({mode:modes[Math.floor(Math.random()*modes.length)],color:colors[Math.floor(Math.random()*colors.length)],count:80+20*Math.floor(Math.random()*32),speed:(1+Math.floor(Math.random()*25))/10,glow:Math.floor(Math.random()*101)});$('preset').value='';$('status').textContent='新的灵感已生成；喜欢的话记得保存参数';});
$('savePreset').addEventListener('click',()=>{try{localStorage.setItem(storageKey,JSON.stringify(settings()));$('status').textContent='参数已保存到当前浏览器（覆盖上次保存）';}catch{$('status').textContent='浏览器不允许本地保存；仍可调整效果并导出图片';}});
$('loadPreset').addEventListener('click',()=>{try{const raw=localStorage.getItem(storageKey);if(raw===null){$('status').textContent='还没有保存的参数，先点击“保存参数”';return;}if(!applySettings(JSON.parse(raw)))throw new Error('Invalid settings');$('preset').value='';$('status').textContent='已恢复保存的参数';}catch{$('status').textContent='无法读取有效参数；当前效果保持不变';}});
for(const id of ['mode','color','count','speed','glow'])$(id).addEventListener(id==='mode'?'change':'input',()=>{$('preset').value='';});
document.querySelectorAll('[data-mode],[data-color]').forEach(b=>b.addEventListener('click',()=>{$('preset').value='';}));
$('reset').addEventListener('click',()=>{$('preset').value='';pointer.active=false;draw();});
seed();syncPause();new ResizeObserver(resize).observe(canvas);requestAnimationFrame(frame);
</script></body></html>
